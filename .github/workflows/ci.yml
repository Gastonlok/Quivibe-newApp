name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quivibe
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: quivibe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quivibe -d quivibe_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://quivibe:ci-only@127.0.0.1:5432/quivibe_ci?schema=public
      DIRECT_URL: postgresql://quivibe:ci-only@127.0.0.1:5432/quivibe_ci?schema=public
      AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database and Prisma client
        run: |
          pnpm --filter web exec prisma generate
          pnpm --filter web exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build
