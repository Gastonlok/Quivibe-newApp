services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quivibe
      POSTGRES_USER: quivibe
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - quivibe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quivibe -d quivibe"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  quivibe_postgres_data:
